<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Picker — Visa-Free Travel Map</title>
<meta name="description" content="See where every passport you hold can take you, on one map. Visa-free, visa on arrival, eTA and e-visa requirements for 199 passports and 240 destinations.">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://flagcdn.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- MapLibre replaces Mapbox GL: no access token, no /api/mapbox-token round
     trip on every page load, and no per-map-load billing. The geometry comes
     from our own R2 bucket, which is also what lets the twelve territories that
     never used to render finally appear. -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js" defer></script>

<link rel="stylesheet" href="/css/app.css">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DCD81Z7V4V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DCD81Z7V4V');
</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
        crossorigin="anonymous"
        data-ad-client="ca-pub-6081762145343306"></script>
</head>

<body>
<div id="app" data-screen="picker">

  <!-- Picker -------------------------------------------------------------- -->
  <section id="picker-view" class="screen screen-picker">
    <header class="masthead">
      <h1>Passport Picker</h1>
      <p class="tagline">Every passport you hold, on one map.</p>
    </header>

    <div class="tray-card">
      <div class="tray-head">
        <h2>Your passports</h2>
        <p class="tray-hint">Drag to reorder — the first one wins wherever two are equal.</p>
      </div>
      <div class="tray-row">
        <div id="tray" class="tray" role="list" aria-label="Chosen passports"></div>
        <p id="tray-empty" class="tray-empty">Choose a passport to begin.</p>
        <button id="view-map-btn" type="button" class="btn btn-primary btn-go" aria-label="Show the map">
          <span>Show map</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-wrap">
      <label class="visually-hidden" for="country-search">Search for a country</label>
      <input id="country-search" class="search" type="search" placeholder="Search for a country…"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div id="flag-grid" class="flag-grid" role="group" aria-label="Passports"></div>

    <div id="ad-container" class="ad-slot"></div>

    <footer class="picker-foot">
      <p id="freshness" class="freshness" hidden></p>
    </footer>
  </section>

  <!-- Map ----------------------------------------------------------------- -->
  <section id="map-view" class="screen screen-map" hidden>
    <div id="map-container" class="map-container"></div>

    <div class="map-controls map-controls-left">
      <button id="back-btn" type="button" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span>Back</span>
      </button>
      <button id="share-btn" type="button" class="btn btn-primary">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"></path>
        </svg>
        <span>Share</span>
      </button>
    </div>

    <div class="map-controls map-controls-top">
      <div class="segmented" role="group" aria-label="Map view">
        <button id="visa-view-btn" type="button" class="segment is-active" aria-pressed="true">What I need</button>
        <button id="best-view-btn" type="button" class="segment" aria-pressed="false">Which passport</button>
      </div>
    </div>

    <div id="active-flags" class="active-flags" role="group" aria-label="Passports included in the map"></div>

    <div id="legend" class="legend" role="group" aria-label="Legend"></div>

    <div id="list-panel" class="list-panel">
      <button id="list-toggle" type="button" class="list-toggle" aria-expanded="false" aria-controls="list">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>All destinations</span>
      </button>
      <div class="list-body">
        <label class="visually-hidden" for="list-search">Search destinations</label>
        <input id="list-search" class="search search-sm" type="search" placeholder="Search destinations…" autocomplete="off">
        <p id="list-summary" class="list-summary"></p>
        <div id="list" class="list"></div>
      </div>
    </div>
  </section>

  <!-- Chrome -------------------------------------------------------------- -->
  <div id="loader" class="loader" hidden>
    <div class="loader-inner">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loader-text" class="loader-text">Loading…</p>
    </div>
  </div>

  <p id="notice" class="notice" role="status" aria-live="polite"></p>
</div>

<noscript>
  <p style="padding:2rem;text-align:center;font-family:system-ui,sans-serif">
    Passport Picker needs JavaScript to draw the map.
  </p>
</noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
